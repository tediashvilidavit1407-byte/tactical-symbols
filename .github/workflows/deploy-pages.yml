# GitHub Pages-ზე ავტომატური გამოქვეყნება: main ბრენჩზე ყოველი push-ის შემდეგ
# ჯერ მოწმდება მონაცემები (tools/validate-data.js), შემდეგ ქვეყნდება www/ საქაღალდე.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: მონაცემების შემოწმება
        run: node tools/validate-data.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
